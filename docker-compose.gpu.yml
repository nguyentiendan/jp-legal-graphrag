# GPU override cho model-server và ollama (cần NVIDIA Container Toolkit trên host)
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
services:
  model-server:
    build:
      args:
        TORCH_INDEX_URL: ${TORCH_INDEX_URL_GPU:-https://download.pytorch.org/whl/cu128}
    environment:
      MODEL_DEVICE: cuda
      USE_FP16: "true"
      MAX_SEQ_LENGTH: ${MAX_SEQ_LENGTH:-8192}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${GPU_COUNT:-1}
              capabilities: [gpu]

  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${GPU_COUNT:-1}
              capabilities: [gpu]

name: Deploy to EC2

# push lên main → CI → build & push 4 image lên GHCR → SSH vào EC2 → docker compose pull/up → healthcheck (tự rollback nếu fail)
# Chạy tay (Actions → Deploy to EC2 → Run workflow) để deploy lại / rollback 1 tag cũ.

on:
  push:
    branches: [main]
    paths:
      - "**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/deploy-ec2.yml"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag đã có trên GHCR để deploy lại/rollback (bỏ trống = build từ commit hiện tại)"
        required: false
        default: ""
      skip_tests:
        description: "Bỏ qua CI (chỉ dùng khi khẩn cấp)"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false   # không huỷ giữa chừng một lần deploy

env:
  REGISTRY: ghcr.io

jobs:
  ci:
    if: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.skip_tests || inputs.image_tag != '')) }}
    uses: ./.github/workflows/ci.yml

  meta:
    name: Resolve image tag
    needs: [ci]
    if: ${{ !cancelled() && (needs.ci.result == 'success' || needs.ci.result == 'skipped') }}
    runs-on: ubuntu-latest
    outputs:
      prefix: ${{ steps.m.outputs.prefix }}
      tag: ${{ steps.m.outputs.tag }}
      build: ${{ steps.m.outputs.build }}
    steps:
      - id: m
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "prefix=${REGISTRY}/${owner}/jplegal" >> "$GITHUB_OUTPUT"
          if [ -n "$INPUT_TAG" ]; then
            echo "tag=${INPUT_TAG}" >> "$GITHUB_OUTPUT"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build & push (${{ matrix.name }})
    needs: [meta]
    if: ${{ !cancelled() && needs.meta.result == 'success' && needs.meta.outputs.build == 'true' }}
    # EC2 Graviton: set repo variable EC2_PLATFORM=linux/arm64 → build native trên runner ARM
    runs-on: ${{ vars.EC2_PLATFORM == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: api
            context: backend
            dockerfile: backend/Dockerfile.api
            build_args: ""
          - name: worker
            context: backend
            dockerfile: backend/Dockerfile.worker
            build_args: ""
          - name: web
            context: web
            dockerfile: web/Dockerfile
            build_args: ""
          - name: model-server
            context: services/model-server
            dockerfile: services/model-server/Dockerfile
            # EC2 có GPU (repo variable EC2_GPU=true) → torch CUDA 12.8, ngược lại torch CPU
            build_args: ${{ vars.EC2_GPU == 'true' && 'TORCH_INDEX_URL=https://download.pytorch.org/whl/cu128' || 'TORCH_INDEX_URL=https://download.pytorch.org/whl/cpu' }}
    env:
      PLATFORM: ${{ vars.EC2_PLATFORM || 'linux/amd64' }}
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (torch image lớn)
        if: matrix.name == 'model-server'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ env.PLATFORM }}
          build-args: ${{ matrix.build_args }}
          push: true
          provenance: false
          tags: |
            ${{ needs.meta.outputs.prefix }}/${{ matrix.name }}:${{ needs.meta.outputs.tag }}
            ${{ needs.meta.outputs.prefix }}/${{ matrix.name }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}-${{ env.PLATFORM }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}-${{ env.PLATFORM }}

  deploy:
    name: Deploy to EC2
    needs: [meta, build]
    if: ${{ !cancelled() && needs.meta.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest
    # Settings → Environments → production: thêm secrets/variables ở đây, có thể bật "Required reviewers" để duyệt tay
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    timeout-minutes: 40
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_PORT: ${{ secrets.EC2_SSH_PORT || '22' }}
      REMOTE_DIR: ${{ vars.EC2_APP_DIR || '/opt/jplegal' }}
      IMAGE_PREFIX: ${{ needs.meta.outputs.prefix }}
      IMAGE_TAG: ${{ needs.meta.outputs.tag }}
      USE_GPU: ${{ vars.EC2_GPU || 'false' }}
      ENABLE_OLLAMA: ${{ vars.ENABLE_OLLAMA || 'true' }}
      HEALTH_TIMEOUT: ${{ vars.HEALTH_TIMEOUT || '900' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          test -n "$EC2_HOST" && test -n "$EC2_USER" && test -n "$SSH_KEY" \
            || { echo "::error::Thiếu secret EC2_HOST / EC2_USER / EC2_SSH_KEY"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/ec2 && chmod 600 ~/.ssh/ec2
          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::Chưa set EC2_KNOWN_HOSTS, dùng ssh-keyscan (kém an toàn hơn)"
            ssh-keyscan -p "$EC2_PORT" -H "$EC2_HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host ec2
            HostName $EC2_HOST
            User $EC2_USER
            Port $EC2_PORT
            IdentityFile ~/.ssh/ec2
            IdentitiesOnly yes
            ServerAliveInterval 30
            ServerAliveCountMax 10
          EOF
          ssh ec2 'echo "connected to $(hostname)"; docker compose version'

      - name: Upload compose bundle
        working-directory: .
        run: |
          chmod +x deploy/*.sh
          tar czf - docker-compose.yml docker-compose.gpu.yml docker-compose.prod.yml .env.example deploy \
            | ssh ec2 "mkdir -p '$REMOTE_DIR/data/import' && tar xzf - -C '$REMOTE_DIR'"

      - name: Write .env from secret (tuỳ chọn)
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          if [ -n "$ENV_FILE" ]; then
            printf '%s\n' "$ENV_FILE" | ssh ec2 "umask 077 && cat > '$REMOTE_DIR/.env'"
            echo "Đã ghi .env từ secret ENV_FILE"
          else
            echo "Không có secret ENV_FILE → dùng .env đang có sẵn trên server"
          fi

      - name: Pull & restart stack
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # token đi qua stdin (không nằm trong command line trên server)
          printf '%s' "$GHCR_TOKEN" | ssh ec2 \
            "cd '$REMOTE_DIR' && \
             REGISTRY_USER='${{ github.actor }}' IMAGE_PREFIX='$IMAGE_PREFIX' IMAGE_TAG='$IMAGE_TAG' \
             USE_GPU='$USE_GPU' ENABLE_OLLAMA='$ENABLE_OLLAMA' HEALTH_TIMEOUT='$HEALTH_TIMEOUT' \
             bash deploy/remote-deploy.sh"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Deploy ${{ job.status }}"
            echo "- Image: \`$IMAGE_PREFIX/*:$IMAGE_TAG\`"
            echo "- Host: \`$EC2_USER@$EC2_HOST:$REMOTE_DIR\`"
            echo "- GPU: $USE_GPU · Ollama: $ENABLE_OLLAMA"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/ec2
